overwrite: true
schema:
  - "./backend/schema.graphql"
documents:
  - "scripts/graphql/*.graphql"
generates:
  ./generated/types.ts:
    plugins:
      - "typescript"
      - "typescript-operations"
    config:
      enumsAsTypes: true
      onlyOperationTypes: true
      # JSON-serialized over HTTP: date/time scalars arrive as ISO strings
      scalars:
        DateTime: string
        Date: string
        Time: string
        GenericScalar: unknown
